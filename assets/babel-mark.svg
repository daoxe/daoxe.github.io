<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Project Babel">
  <!--
    Monochrome Babel. Flush stacked tiers (no gaps).
    Spiral stair: each cut runs from a tier's top-left to the next
    tier's right edge, a little above that tier's bottom-right.
    Ink #E8E6E1 on transparent ground.
  -->
  <defs>
    <mask id="stair">
      <rect width="48" height="48" fill="#fff"/>
      <!--
        Flush tiers (x, y, w, h):
          1: 18,6  12x9   TL(18,6)  -> next right, above BR: (34, 21.5)
          2: 14,15 20x9   TL(14,15) -> (38, 30.5)
          3: 10,24 28x9   TL(10,24) -> (42, 39.5)
          4: 6,33  36x9   TL(6,33)  -> own right, above BR: (42, 40.5)
      -->
      <line x1="18" y1="6"  x2="34" y2="21.5" stroke="#000" stroke-width="2.6" stroke-linecap="butt"/>
      <line x1="14" y1="15" x2="38" y2="30.5" stroke="#000" stroke-width="2.6" stroke-linecap="butt"/>
      <line x1="10" y1="24" x2="42" y2="39.5" stroke="#000" stroke-width="2.6" stroke-linecap="butt"/>
      <line x1="6"  y1="33" x2="42" y2="40.5" stroke="#000" stroke-width="2.6" stroke-linecap="butt"/>
    </mask>
  </defs>

  <g mask="url(#stair)" fill="#E8E6E1">
    <rect x="18" y="6"  width="12" height="9"/>
    <rect x="14" y="15" width="20" height="9"/>
    <rect x="10" y="24" width="28" height="9"/>
    <rect x="6"  y="33" width="36" height="9"/>
  </g>
</svg>
