<script>
/* If this folder is hosted off daoxe.github.io (Babel /public/, custom domain),
   rewrite absolute og/canonical/twitter image URLs to the live origin. */
(function () {
  try {
    var PRIMARY = "https://daoxe.github.io";
    var path = location.pathname;
    if (/index\.html$/i.test(path)) path = path.replace(/index\.html$/i, "");
    if (!path.endsWith("/")) path = path.replace(/[^/]*$/, "");
    if (!path.endsWith("/")) path += "/";
    var root = location.origin + path;
    if (root.replace(/\/$/, "") === PRIMARY) return;
    function abs(rel) {
      rel = (rel || "").replace(/^\.\//, "");
      if (/^https?:\/\//i.test(rel)) {
        // swap primary host prefix for current root
        if (rel.indexOf(PRIMARY + "/") === 0) return root + rel.slice(PRIMARY.length + 1);
        return rel;
      }
      return root + rel.replace(/^\//, "");
    }
    var nodes = document.querySelectorAll(
      'meta[property="og:url"],meta[property="og:image"],meta[property="og:image:secure_url"],meta[name="twitter:image"],link[rel="canonical"]'
    );
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      var key = el.hasAttribute("content") ? "content" : "href";
      var cur = el.getAttribute(key) || "";
      if (!cur) continue;
      el.setAttribute(key, abs(cur));
    }
  } catch (e) {}
})();

<script>
/* roaring smoke -- full height, monochrome */
(function(){
  "use strict";
  var canvas=document.querySelector(".bg-canvas");
  if(!canvas)return;
  var ctx=canvas.getContext("2d",{alpha:false});
  if(!ctx)return;
  var VOID=[6,6,7];

  function makeNoise(seed){
    var s=seed>>>0,perm=new Uint8Array(512),p=new Uint8Array(256),i;
    for(i=0;i<256;i++)p[i]=i;
    function rnd(){s^=s<<13;s^=s>>>17;s^=s<<5;return(s>>>0)/4294967296;}
    for(var j=255;j>0;j--){var k=(rnd()*(j+1))|0,t=p[j];p[j]=p[k];p[k]=t;}
    for(var m=0;m<512;m++)perm[m]=p[m&255];
    function fade(t){return t*t*(3-2*t);}
    function val(ix,iy,iz){return perm[(ix+perm[(iy+perm[iz&255])&255])&255]/255*2-1;}
    function lerp(a,b,t){return a+(b-a)*t;}
    function n3(x,y,z){
      var ix=Math.floor(x),iy=Math.floor(y),iz=Math.floor(z);
      var fx=x-ix,fy=y-iy,fz=z-iz,u=fade(fx),v=fade(fy),w=fade(fz);
      var c000=val(ix,iy,iz),c100=val(ix+1,iy,iz),c010=val(ix,iy+1,iz),c110=val(ix+1,iy+1,iz);
      var c001=val(ix,iy,iz+1),c101=val(ix+1,iy,iz+1),c011=val(ix,iy+1,iz+1),c111=val(ix+1,iy+1,iz+1);
      var x00=lerp(c000,c100,u),x10=lerp(c010,c110,u),x01=lerp(c001,c101,u),x11=lerp(c011,c111,u);
      return lerp(lerp(x00,x10,v),lerp(x01,x11,v),w);
    }
    function fbm(x,y,z,oct){
      var amp=0.5,freq=1,sum=0,norm=0;
      for(var i2=0;i2<(oct||4);i2++){sum+=amp*n3(x*freq,y*freq,z*freq);norm+=amp;amp*=0.5;freq*=2;}
      return sum/norm;
    }
    return{fbm:fbm};
  }

  var BAYER8=[0,48,12,60,3,51,15,63,32,16,44,28,35,19,47,31,8,56,4,52,11,59,7,55,
    40,24,36,20,43,27,39,23,2,50,14,62,1,49,13,61,34,18,46,30,33,17,45,29,
    10,58,6,54,9,57,5,53,42,26,38,22,41,25,37,21];

  /* Cooled + dimmed 2026-07-28. The old top stop (255,220,170) glowed gold,
     which reads as warmth/hearth; this ramp keeps only a dead ember at the
     very top and lets the body of the smoke go grey-blue. */
  var STOPS=[[0.0,6,6,7],[0.28,24,25,29],[0.52,62,64,72],
    [0.72,124,128,136],[0.88,182,186,190],[1.0,214,208,196]];
  function ramp(q){
    if(q<=0)return[STOPS[0][1],STOPS[0][2],STOPS[0][3]];
    if(q>=1)return[STOPS[5][1],STOPS[5][2],STOPS[5][3]];
    for(var i=1;i<STOPS.length;i++){
      if(q<=STOPS[i][0]){
        var a=STOPS[i-1],b=STOPS[i],t=(q-a[0])/(b[0]-a[0]);
        return[a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t,a[3]+(b[3]-a[3])*t];
      }
    }
    return[255,220,170];
  }
  var LUT=new Uint8Array(256*3);
  for(var li=0;li<256;li++){var c=ramp(li/255);LUT[li*3]=c[0]|0;LUT[li*3+1]=c[1]|0;LUT[li*3+2]=c[2]|0;}

  function mist(w,h){
    var noise=makeNoise(4242);
    var GP=2,bw=Math.max(2,Math.ceil(w/GP)),bh=Math.max(2,Math.ceil(h/GP));
    var off=document.createElement("canvas");off.width=bw;off.height=bh;
    var octx=off.getContext("2d");var img=octx.createImageData(bw,bh);var data=img.data;
    for(var z0=0;z0<data.length;z0+=4){data[z0]=VOID[0];data[z0+1]=VOID[1];data[z0+2]=VOID[2];data[z0+3]=255;}

    var topRow=Math.floor(bh*0.20);
    var BASE_ERODE=0.42;
    var GS=44,gw=Math.ceil(w/GS)+2,gh=Math.ceil(h/GS)+2;
    var grid=new Float32Array(gw*gh),perCell=GS/GP;
    function smooth(e0,e1,x){var tt=(x-e0)/(e1-e0);if(tt<0)tt=0;else if(tt>1)tt=1;return tt*tt*(3-2*tt);}

    return{frame:function(t){
      /* Slowed 2026-07-28 -- roiling reads as energy, creeping reads as dread. */
      var rise=t*0.32,drift=t*0.46,shear=t*0.24;
      for(var gy=0;gy<gh;gy++){
        var base=gy*gw,sh=Math.sin(gy*0.35+shear)*0.9;
        for(var gx=0;gx<gw;gx++)grid[base+gx]=noise.fbm(gx*0.6+sh,gy*0.6-rise,drift,5);
      }
      for(var by=topRow;by<bh;by++){
        var hbf=(bh-by)/bh,fy=by/perCell,iy=fy|0,tyc=fy-iy;
        var r0=iy*gw,r1=(iy+1)*gw,rowB=(by&7)*8;
        for(var bx=0;bx<bw;bx++){
          var fx=bx/perCell,ix=fx|0,txc=fx-ix;
          var a=grid[r0+ix],b=grid[r0+ix+1],cc=grid[r1+ix],d=grid[r1+ix+1];
          var top=a+(b-a)*txc,bot=cc+(d-cc)*txc;
          var cloud=(top+(bot-top)*tyc)*0.5+0.5;
          var hbfW=hbf+(cloud-0.5)*0.28;
          var covV=1-smooth(0.12,0.64,hbfW);
          var vB=1-smooth(0.0,0.64,hbfW);
          var mistH=(bh-by)/(bh-topRow)+(cloud-0.5)*0.62;
          var cov=covV+(cloud-0.5)*0.28-BASE_ERODE*mistH;
          var thr=(BAYER8[rowB+(bx&7)]+0.5)/64;
          var o=(by*bw+bx)<<2;
          if(cov>thr){
            var inten=(0.42+0.58*cloud)*(0.34+0.66*vB);
            if(cloud>0.62){var e=(cloud-0.62)/0.38;inten+=0.34*e*e*vB;}
            inten*=0.86+0.14*Math.sin(t*1.4+cloud*6.0);
            if(inten>1)inten=1;else if(inten<0)inten=0;
            var gi=(inten*255)|0,l=gi*3;
            data[o]=LUT[l];data[o+1]=LUT[l+1];data[o+2]=LUT[l+2];
          }else{data[o]=VOID[0];data[o+1]=VOID[1];data[o+2]=VOID[2];}
        }
      }
      octx.putImageData(img,0,0);
      ctx.imageSmoothingEnabled=false;
      ctx.drawImage(off,0,0,bw,bh,0,0,w,h);
    }};
  }

  var DPR=Math.min(window.devicePixelRatio||1,1.25),W=0,H=0,inst=null;
  function measure(){var w=window.innerWidth,h=window.innerHeight,vv=window.visualViewport;
    if(vv){w=Math.max(w,vv.width);h=Math.max(h,vv.height);}return{w:w,h:h};}
  function build(){var d=measure();W=d.w;H=d.h;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle="#060607";ctx.fillRect(0,0,W,H);inst=mist(W,H);}
  function seed(){for(var i=0,tt=0;i<44;i++){tt+=1/30;inst.frame(tt);}}
  build();seed();
  var rz;window.addEventListener("resize",function(){clearTimeout(rz);rz=setTimeout(function(){
    var d=measure();if(Math.abs(d.w-W)>=0.5||Math.abs(d.h-H)>=0.5){build();seed();}},180);});

  var FRAME=1000/30,simTime=0,last=0;
  function loop(now){requestAnimationFrame(loop);
    if(document.hidden){last=0;return;}
    if(!last)last=now;var el=now-last;
    if(el>=FRAME){last=now;simTime+=Math.min(el,100)/1000;inst.frame(simTime);}}
  requestAnimationFrame(loop);
})();
</script>
